<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Banner interativo com propagação de ondas radiais pixeladas em ritmo customizado.">
    <title>Banner Radial - Estrondo Rítmico Acelerado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
        }

        /* Contêiner restrito em 16:9 Full HD */
        #banner-estrondo {
            position: relative;
            width: 100%;
            max-width: 1920px;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            overflow: hidden;
            display: block;
        }

        #ondasCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.25;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        .banner-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            color: #ffffff;
            text-align: center;
            pointer-events: auto;
        }
    </style>
</head>

<body>

    <section id="banner-estrondo" aria-label="Animação acelerada de ondas radiais dispersas" role="banner">
        <canvas id="ondasCanvas" width="1920" height="1080"></canvas>
        <div class="noise-overlay"></div>

        <div class="banner-content">
        </div>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const canvas = document.getElementById("ondasCanvas");
            const ctx = canvas.getContext("2d", { alpha: false });

            const width = 1920;
            const height = 1080;
            const centerX = width / 2;
            const centerY = height / 2;
            const maxRadius = Math.hypot(width, height) / 2;

            const baseColor = "255, 102, 0";

            let waves = [];
            let lastTime = performance.now();
            let timer = 0;
            let beatIndex = 0;

            // Tempos reduzidos pela metade (em milissegundos)
            const beatDelays = [
                1500, // Após 1ª batida 
                1000, // 1ª do conjunto de 3
                1000, // 2ª do conjunto de 3
                1500, // 3ª do conjunto de 3
                1500, // Após batida isolada
                1000, // 1ª do conjunto de 2
                1500  // 2ª do conjunto de 2 (reinicia)
            ];

            class Wave {
                constructor() {
                    this.radius = 80; // Círculo inicial maior
                    this.speed = 700; // Velocidade aumentada para compensar o ritmo mais rápido
                    this.active = true;

                    this.dashOffset1 = Math.random() * 100;
                    this.dashOffset2 = Math.random() * 100;
                    this.dashOffset3 = Math.random() * 100;
                }

                update(deltaTime) {
                    this.radius += this.speed * (deltaTime / 1000);

                    if (this.radius > maxRadius + 150) {
                        this.active = false;
                    }
                }

                draw(ctx) {
                    let opacity = 1;

                    if (this.radius < 200) {
                        opacity = (this.radius - 80) / 120;
                    } else if (this.radius > maxRadius - 400) {
                        opacity = (maxRadius - this.radius) / 400;
                    }
                    opacity = Math.max(0, Math.min(1, opacity));

                    if (opacity <= 0) return;

                    // Camada 1: Base volumétrica (mais espessa)
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, this.radius, 0, Math.PI * 2);
                    ctx.lineWidth = 80;
                    ctx.strokeStyle = `rgba(${baseColor}, ${opacity * 0.1})`;
                    ctx.setLineDash([]);
                    ctx.stroke();

                    ctx.lineCap = "butt";

                    // Camada 2: Pixels primários (maiores e mais dispersos)
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, this.radius, 0, Math.PI * 2);
                    ctx.lineWidth = 10;
                    ctx.strokeStyle = `rgba(255, 150, 0, ${opacity * 0.7})`;
                    ctx.setLineDash([15, 60]); // 15px de traço, 60px de vazio
                    ctx.lineDashOffset = this.dashOffset1 - (this.radius * 0.1);
                    ctx.stroke();

                    // Camada 3: Pixels secundários (dispersão intermediária)
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, this.radius - 30, 0, Math.PI * 2);
                    ctx.lineWidth = 6;
                    ctx.strokeStyle = `rgba(255, 200, 100, ${opacity * 0.9})`;
                    ctx.setLineDash([8, 35]);
                    ctx.lineDashOffset = this.dashOffset2 + (this.radius * 0.15);
                    ctx.stroke();

                    // Camada 4: Rastro disperso
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, this.radius - 60, 0, Math.PI * 2);
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = `rgba(255, 120, 0, ${opacity * 0.6})`;
                    ctx.setLineDash([4, 25]);
                    ctx.lineDashOffset = this.dashOffset3;
                    ctx.stroke();

                    ctx.setLineDash([]);
                }
            }

            waves.push(new Wave());

            function animate(currentTime) {
                const deltaTime = currentTime - lastTime;
                lastTime = currentTime;

                ctx.fillStyle = "#000000";
                ctx.fillRect(0, 0, width, height);

                timer += deltaTime;
                if (timer >= beatDelays[beatIndex]) {
                    waves.push(new Wave());
                    timer = 0;
                    beatIndex = (beatIndex + 1) % beatDelays.length;
                }

                for (let i = waves.length - 1; i >= 0; i--) {
                    waves[i].update(deltaTime);
                    waves[i].draw(ctx);

                    if (!waves[i].active) {
                        waves.splice(i, 1);
                    }
                }

                // Núcleo emissor proporcionalmente maior
                const pulseIntensity = Math.max(0, 1 - (timer / 300)); // Pico mais rápido (300ms)
                const pulseRadius = 100 + (pulseIntensity * 30);

                const centerGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 140);
                centerGradient.addColorStop(0, `rgba(255, ${200 + (pulseIntensity * 55)}, 100, 1)`);
                centerGradient.addColorStop(0.3, `rgba(${baseColor}, ${0.8 + (pulseIntensity * 0.2)})`);
                centerGradient.addColorStop(1, `rgba(0, 0, 0, 0)`);

                ctx.fillStyle = centerGradient;
                ctx.beginPath();
                ctx.arc(centerX, centerY, pulseRadius, 0, Math.PI * 2);
                ctx.fill();

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
        });
    </script>
</body>

</html>
